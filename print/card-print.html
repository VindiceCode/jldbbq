@page { size: 3.75in 2.25in; margin: 0; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#fff; }
.bleed {
  width:3.75in; height:2.25in; position:relative; overflow:hidden;
  background:#EDE7DC; page-break-after:always; break-after:page;
}
.bleed:last-child { page-break-after:auto; break-after:auto; }
.trim {
  position:absolute; left:.125in; top:.125in; width:3.5in; height:2in;
  container-type:inline-size;
}
.disp { font-family:'Alfa Slab One',serif; font-weight:400; }
.scr  { font-family:'Yellowtail',cursive; font-weight:400; }
.head { font-family:'Oswald',sans-serif; }
.body { font-family:'Inter',sans-serif; }

/* ---------- FRONT ---------- */
.f-left { position:absolute; inset:0 33% 0 0; display:flex; flex-direction:column;
          justify-content:space-between; padding:5.5%; }
.logo { display:flex; flex-direction:column; align-items:flex-start; line-height:1; }
.logo .l1 { font-size:7.6cqw; color:#7B241C; transform:rotate(-4deg);
            margin-bottom:.16em; margin-left:.06em; }
.logo .l2 { font-size:14.6cqw; line-height:.82; letter-spacing:-.02em; color:#191512; }
.logo .l3 { font-size:4.6cqw; font-weight:700; letter-spacing:.22em; color:#7B241C; margin-top:.35em; }
.logo .l4 { font-size:2cqw; letter-spacing:.4em; color:#6B635A; margin-top:.6em; }
.cta1 { font-size:3.1cqw; font-weight:700; text-transform:uppercase; letter-spacing:.16em; color:#7B241C; }
.cta2 { font-size:2.5cqw; font-weight:600; text-transform:uppercase; letter-spacing:.12em;
        color:#4A413A; margin-top:.3em; display:flex; align-items:center; gap:.5em; }
.cta2 svg { width:3.2cqw; height:3.2cqw; flex:none; }
.drip { position:absolute; left:61%; top:-.125in; height:calc(58% + .125in); width:6.5%; }
.photo { position:absolute; top:-.125in; bottom:-.125in; right:-.125in;
         width:calc(33% + .125in); overflow:hidden; }
.photo img { width:100%; height:100%; object-fit:cover; display:block; }
.photo .fade { position:absolute; inset:0;
  background:linear-gradient(to right,#EDE7DC 0%,rgba(237,231,220,0) 55%); }

/* ---------- BACK ---------- */
.b-bar { position:absolute; left:-.125in; right:-.125in; top:-.125in;
         height:calc(6% + .125in); background:#4A0F0A; }
.b-wrap { position:absolute; inset:0; display:flex; align-items:center; gap:5%;
          padding:6% 5.5% 0; }
.qr { width:38%; flex:none; display:flex; flex-direction:column; align-items:center; }
.qr img { width:100%; display:block; border-radius:2px; }
.qr span { font-size:2.4cqw; font-weight:700; text-transform:uppercase; letter-spacing:.13em;
           color:#7B241C; margin-top:.55em; text-align:center; line-height:1.15; }
.b-info { flex:1; min-width:0; }
.b-name { font-size:5cqw; line-height:1.1; color:#191512; }
.b-sub  { font-size:2.4cqw; font-weight:700; text-transform:uppercase; letter-spacing:.24em;
          color:#7B241C; margin-top:.3em; }
.b-list { list-style:none; margin-top:.9em; display:flex; flex-direction:column; gap:.55em; }
.b-list li { display:flex; align-items:center; gap:.6em; font-size:3cqw; color:#191512; }
.b-list svg { width:1.1em; height:1.1em; flex:none; color:#7B241C; }
